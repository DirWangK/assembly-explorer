<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assembly Explorer · 汇编实验室 — Keystone ⇄ Capstone ⇄ Unicorn</title>
<meta name="description" content="浏览器里的多架构汇编实验室：Keystone 汇编、Capstone 反汇编、Unicorn 单步调试与模拟执行，全部通过 WebAssembly 运行。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%2313161c'/%3E%3Crect x='7' y='7' width='8' height='8' rx='1.5' fill='%23e5b567'/%3E%3Crect x='17' y='7' width='8' height='8' rx='1.5' fill='%236fc3df'/%3E%3Crect x='12' y='17' width='8' height='8' rx='1.5' fill='%23b294bb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="7" y="7" width="8" height="8" rx="1.5" class="lg-ks"></rect>
      <rect x="17" y="7" width="8" height="8" rx="1.5" class="lg-cs"></rect>
      <rect x="12" y="17" width="8" height="8" rx="1.5" class="lg-uc"></rect>
    </svg>
    <div class="brand-text">
      <h1 data-i18n="app.title">Assembly Explorer</h1>
      <span class="subtitle" data-i18n="app.subtitle"></span>
    </div>
  </div>

  <div class="controls">
    <label class="ctl"><span data-i18n="ctl.arch"></span>
      <select id="arch"></select>
    </label>
    <label class="ctl"><span data-i18n="ctl.syntax"></span>
      <select id="syntax"></select>
    </label>
    <label class="ctl"><span data-i18n="ctl.base"></span>
      <input id="base" value="0x10000" spellcheck="false">
    </label>
  </div>

  <div class="controls right">
    <div class="seg" id="theme-seg" role="group" data-i18n-title="ctl.theme" title="主题">
      <button data-theme-opt="dark" data-i18n="theme.dark"></button>
      <button data-theme-opt="light" data-i18n="theme.light"></button>
      <button data-theme-opt="system" data-i18n="theme.system"></button>
    </div>
    <div class="seg" id="lang-seg" role="group">
      <button data-lang-opt="zh" data-i18n="lang.zh"></button>
      <button data-lang-opt="en" data-i18n="lang.en"></button>
    </div>
    <button id="share" class="btn" data-i18n="btn.share" data-i18n-title="btn.share"></button>
    <div class="status" id="status">
      <span class="pill">Keystone …</span><span class="pill">Capstone …</span><span class="pill">Unicorn …</span>
    </div>
  </div>

  <div class="engine-load" id="engine-load" role="status" aria-live="polite" aria-busy="true">
    <span class="engine-dot" aria-hidden="true"></span>
    <span class="engine-load-text" id="engine-load-text">正在加载引擎 · Loading engines…</span>
    <div class="engine-track" id="engine-track" role="progressbar"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="engine-fill" id="engine-fill"></div>
    </div>
    <span class="engine-load-pct" id="engine-load-pct">0%</span>
  </div>
</header>

<main class="grid">

  <!-- 第 1 栏：输入（源码 / 机器码）+ Keystone -->
  <section class="pane">
    <div class="pane-head">
      <span class="tag ks" data-i18n="pane1.tag"></span>
      <span class="pane-title" data-i18n="pane1.title"></span>
      <div class="seg small" id="input-seg" role="group">
        <button id="tab-src" class="on" data-i18n="tab.source" data-i18n-title="tab.sourceHint"></button>
        <button id="tab-hex" data-i18n="tab.hex" data-i18n-title="tab.hexHint"></button>
      </div>
      <button id="example" class="btn small" data-i18n="btn.loadExample"></button>
    </div>

    <div id="src-view" class="input-view">
      <div id="editor-wrap" class="editor-host">
        <div class="editor-placeholder">编辑器准备中 · Preparing editor…</div>
      </div>
      <div class="pane-foot" id="src-status"></div>
    </div>

    <div id="hex-view" class="pane-body hidden">
      <div class="hexin-toolbar">
        <button id="hexin-toasm" class="btn small primary" data-i18n="btn.toAsm"></button>
        <button id="hexin-gen" class="btn small" data-i18n="btn.gen"></button>
        <button id="hexin-import" class="btn small" data-i18n="btn.import"></button>
        <input type="file" id="hexin-file" class="hidden" accept=".bin,.hex,.txt,.s,.asm,.dump,.out">
      </div>
      <textarea id="hexin" class="cfg-input hexin-input" rows="16" spellcheck="false" data-i18n-ph="hexin.placeholder"></textarea>
      <div class="hexin-help" data-i18n="hexin.help"></div>
      <div id="hexin-status" class="hexin-status"></div>
    </div>
  </section>

  <!-- 第 2 栏：机器码 + Capstone（纯输出） -->
  <section class="pane">
    <div class="pane-head">
      <span class="tag cs" data-i18n="pane2.tag"></span>
      <span class="pane-title" data-i18n="pane2.title"></span>
      <span class="meta" id="out-meta"></span>
    </div>
    <div class="pane-body">
      <div class="subhead" data-i18n="pane2.hexdump"></div>
      <div id="hexdump" class="mono-list"></div>
      <div class="subhead"><span data-i18n="pane2.disasm"></span>
        <span class="dim bp-hint" data-i18n="pane3.bpHint"></span>
      </div>
      <div id="disasm" class="mono-list"></div>
      <div class="subhead" data-i18n="pane2.data"></div>
      <div id="datadump" class="mono-list"></div>
    </div>
  </section>

  <!-- 第 3 栏：Unicorn 调试器 -->
  <section class="pane">
    <div class="pane-head">
      <span class="tag uc" data-i18n="pane3.tag"></span>
      <span class="pane-title" data-i18n="pane3.title"></span>
      <span class="meta" id="emu-meta"></span>
    </div>
    <div class="dbg-bar">
      <button id="dbg-run" class="btn dbg primary" data-i18n-title="btn.run" title="运行">▶</button>
      <button id="dbg-pause" class="btn dbg" data-i18n-title="btn.pause" title="暂停">⏸</button>
      <button id="dbg-stepin" class="btn dbg" data-i18n-title="btn.stepIn" title="步入">⤵</button>
      <button id="dbg-stepover" class="btn dbg" data-i18n-title="btn.stepOver" title="步过">⏭</button>
      <button id="dbg-stop" class="btn dbg" data-i18n-title="btn.stop" title="停止">⏹</button>
      <button id="dbg-mem" class="btn dbg" data-i18n-title="mem.titleManual" title="内存映射 / 导入数据"><span data-i18n="mem.btn">内存</span></button>
      <label class="ctl chk auto"><input type="checkbox" id="autoemu" checked><span data-i18n="btn.autoRun"></span></label>
      <span class="dbg-state" id="dbg-state"></span>
    </div>
    <div class="pane-body">
      <details class="env-details">
        <summary data-i18n="pane3.env"></summary>
        <div class="emu-config">
          <div class="cfg-col">
            <div class="cfg-label" data-i18n="pane3.envRegs"></div>
            <textarea id="initregs" class="cfg-input" rows="3" spellcheck="false" data-i18n-ph="pane3.envRegs"></textarea>
          </div>
          <div class="cfg-col">
            <div class="cfg-label" data-i18n="pane3.envMem"></div>
            <textarea id="initmem" class="cfg-input" rows="3" spellcheck="false" data-i18n-ph="pane3.envMem"></textarea>
          </div>
          <label class="ctl wide"><span data-i18n="pane3.maxInsns"></span>
            <input id="maxinsns" value="200000" spellcheck="false">
          </label>
          <div id="emu-warn" class="emu-warn"></div>
        </div>
      </details>

      <div class="subhead"><span data-i18n="sec.regs"></span><span class="dim" data-i18n="sec.regsHint"></span></div>
      <div id="regs" class="mono-list"></div>

      <div class="subhead"><span data-i18n="sec.console"></span><span class="dim" data-i18n="sec.consoleHint"></span></div>
      <div id="console" class="mono-list"></div>

      <div class="subhead"><span data-i18n="sec.trace"></span><span class="dim" data-i18n="sec.traceHint"></span></div>
      <div id="trace" class="mono-list"></div>

      <div class="subhead" data-i18n="sec.memops"></div>
      <div id="memops" class="mono-list"></div>
    </div>
  </section>

</main>

<!-- 底部日志面板：分级过滤 / 跟随滚动 / 折叠 -->
<section class="logbar" id="logbar">
  <div class="logbar-head">
    <button class="btn small ghost" id="log-toggle" aria-expanded="true" aria-controls="logbody">
      <span class="log-ico">▾</span><span data-i18n="log.title"></span>
    </button>
    <span class="log-count" id="log-count"></span>
    <label class="ctl chk"><input type="checkbox" id="log-follow" checked><span data-i18n="log.follow"></span></label>
    <span class="log-spacer"></span>
    <label class="ctl"><span data-i18n="log.level"></span>
      <select id="log-level">
        <option value="debug">debug</option>
        <option value="info" selected>info</option>
        <option value="warn">warn</option>
        <option value="error">error</option>
      </select>
    </label>
    <button class="btn small" id="log-clear" data-i18n="log.clear"></button>
  </div>
  <div class="logbody" id="logbody"></div>
</section>

<footer class="foot">
  <span data-i18n="foot.pipeline"></span>
  <span class="dim" data-i18n="foot.tech"></span>
</footer>

<div id="mem-backdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mem-title">
    <div class="modal-head">
      <div class="modal-head-text">
        <div class="modal-title" id="mem-title">内存未映射</div>
        <div class="modal-sub" id="mem-sub"></div>
      </div>
      <button class="btn small ghost modal-x" id="mem-x" title="✕">✕</button>
    </div>
    <div class="modal-body">
      <div class="mem-badges" id="mem-badges"></div>
      <div class="mem-row">
        <label class="mem-field"><span data-i18n="mem.addr">起始地址</span>
          <input id="mem-addr" spellcheck="false" autocomplete="off">
        </label>
        <label class="mem-field"><span data-i18n="mem.size">大小</span>
          <select id="mem-size">
            <option value="4096" data-i18n="mem.size4k">4 KiB（一页）</option>
            <option value="65536" data-i18n="mem.size64k">64 KiB</option>
            <option value="1048576" data-i18n="mem.size1m">1 MiB</option>
            <option value="custom" data-i18n="mem.sizeCustom">自定义</option>
          </select>
        </label>
      </div>
      <label class="mem-field hidden" id="mem-custom-wrap"><span data-i18n="mem.customKb">自定义（KiB）</span>
        <input id="mem-custom" value="4" spellcheck="false">
      </label>

      <div class="mem-label" data-i18n="mem.data">写入数据（可选）</div>
      <div class="seg small" id="mem-data-seg">
        <button data-kind="none" class="on" data-i18n="mem.dataNone">空页</button>
        <button data-kind="text" data-i18n="mem.dataText">文本 / HEX</button>
        <button data-kind="file" data-i18n="mem.dataFile">文件</button>
      </div>
      <textarea id="mem-data-text" class="cfg-input mem-textarea hidden" rows="3" spellcheck="false"
        data-i18n-ph="mem.dataPh"></textarea>
      <div id="mem-file-row" class="mem-file hidden">
        <button class="btn small" id="mem-file-btn" data-i18n="mem.filePick">选择文件</button>
        <span class="dim" id="mem-file-name">未选择文件</span>
        <input type="file" id="mem-file" class="hidden">
      </div>

      <div class="mem-range" id="mem-range"></div>
      <div class="mem-hint" id="mem-hint"></div>
      <div class="mem-err" id="mem-err"></div>

      <div class="mem-regions-wrap">
        <div class="mem-label" data-i18n="mem.regions">当前映射</div>
        <div class="mem-regions" id="mem-regions"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn small ghost hidden" id="mem-clear" data-i18n="mem.clear">清除自定义映射</button>
      <span class="modal-spacer"></span>
      <button class="btn small" id="mem-cancel" data-i18n="mem.cancel">取消</button>
      <button class="btn small" id="mem-apply" data-i18n="mem.apply">仅映射</button>
      <button class="btn small primary" id="mem-continue" data-i18n="mem.continue">映射并继续</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/capstone.js"></script>
<script src="js/ui/i18n.js"></script>
<script src="js/core/arches.js"></script>
<script src="js/core/hexio.js"></script>
<script src="js/core/session-payload.js"></script>
<script src="js/ui/dom.js"></script>
<script src="js/ui/state.js"></script>
<script src="js/ui/log.js"></script>
<script src="js/ui/engines.js"></script>
<script src="js/ui/output.js"></script>
<script src="js/ui/editor.js"></script>
<script src="js/ui/debugger.js"></script>
<script src="js/ui/memfault.js"></script>
<script src="js/ui/input.js"></script>
<script src="js/ui/prefs.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
